<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1e5c38"/>
      <stop offset="55%" stop-color="#0f2e1d"/>
      <stop offset="100%" stop-color="#071610"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5d97a"/>
      <stop offset="25%"  stop-color="#c8960e"/>
      <stop offset="50%"  stop-color="#f0c93a"/>
      <stop offset="75%"  stop-color="#a87208"/>
      <stop offset="100%" stop-color="#f5d97a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Gold outer border - full solid gold -->
  <rect x="5" y="5" width="502" height="502" rx="87"
        fill="none" stroke="url(#goldBorder)" stroke-width="16"/>

  <!-- Gold inner accent line -->
  <rect x="22" y="22" width="468" height="468" rx="72"
        fill="none" stroke="rgba(245,217,122,0.30)" stroke-width="2"/>

  <!-- Joker hat: fill most of the icon, centered, slight downward nudge for visual balance -->
  <image href="/joker-hat.png" x="56" y="60" width="400" height="400"
         preserveAspectRatio="xMidYMid meet"/>
</svg>

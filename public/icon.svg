<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a6040"/>
      <stop offset="100%" stop-color="#0f2a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,150,10,0.18)"/>
      <stop offset="100%" stop-color="rgba(200,150,10,0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle overhead lamp glow -->
  <ellipse cx="256" cy="160" rx="220" ry="180" fill="url(#glow)"/>

  <!-- Gold border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#b8860b" stroke-width="16" opacity="0.7"/>
  <rect x="18" y="18" width="476" height="476" rx="82" fill="none" stroke="rgba(255,220,100,0.25)" stroke-width="4"/>

  <!-- Spade ♠ — top left, white -->
  <text x="138" y="215"
        font-family="Georgia,serif" font-size="168" text-anchor="middle"
        fill="white" filter="url(#shadow)">♠</text>

  <!-- Heart ♥ — top right, red -->
  <text x="374" y="215"
        font-family="Georgia,serif" font-size="168" text-anchor="middle"
        fill="#d42020" filter="url(#shadow)">♥</text>

  <!-- Club ♣ — bottom left, white -->
  <text x="138" y="410"
        font-family="Georgia,serif" font-size="168" text-anchor="middle"
        fill="white" filter="url(#shadow)">♣</text>

  <!-- Diamond ♦ — bottom right, red -->
  <text x="374" y="410"
        font-family="Georgia,serif" font-size="168" text-anchor="middle"
        fill="#d42020" filter="url(#shadow)">♦</text>

  <!-- Thin gold dividers -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="rgba(200,160,20,0.3)" stroke-width="2"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="rgba(200,160,20,0.3)" stroke-width="2"/>
</svg>

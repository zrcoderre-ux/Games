<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a6040"/>
      <stop offset="100%" stop-color="#0f2a1a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.7)"/>
    </filter>
    <!-- Turn black silhouette purple -->
    <filter id="white-hat" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.48
                0 0 0 0 0.18
                0 0 0 0 0.75
                0 0 0 1 0"/>
    </filter>
  </defs>

  <!-- Green felt background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Purple border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#7b2fbe" stroke-width="22"/>
  <rect x="14" y="14" width="484" height="484" rx="86" fill="none" stroke="rgba(180,100,255,0.35)" stroke-width="5"/>

  <!-- Spade ♠ — top-left, black -->
  <text x="108" y="155"
        font-family="Georgia,serif" font-size="130" text-anchor="middle"
        fill="#111" filter="url(#shadow)">♠</text>

  <!-- Heart ♥ — top-right, red -->
  <text x="404" y="155"
        font-family="Georgia,serif" font-size="130" text-anchor="middle"
        fill="#cc1111" filter="url(#shadow)">♥</text>

  <!-- Club ♣ — bottom-left, black -->
  <text x="108" y="440"
        font-family="Georgia,serif" font-size="130" text-anchor="middle"
        fill="#111" filter="url(#shadow)">♣</text>

  <!-- Diamond ♦ — bottom-right, red -->
  <text x="404" y="440"
        font-family="Georgia,serif" font-size="130" text-anchor="middle"
        fill="#cc1111" filter="url(#shadow)">♦</text>

  <!-- Joker hat — centered, white silhouette -->
  <image href="/joker-silhouette.png"
         x="156" y="176" width="200" height="160"
         filter="url(#white-hat)"
         opacity="0.88"/>
</svg>

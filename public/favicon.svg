<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a6040"/>
      <stop offset="100%" stop-color="#0f2a1a"/>
    </radialGradient>
    <filter id="white-hat" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.48
                0 0 0 0 0.18
                0 0 0 0 0.75
                0 0 0 1 0"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Purple border -->
  <rect width="32" height="32" rx="6" fill="none" stroke="#7b2fbe" stroke-width="2"/>
  <!-- ♠ top-left, black -->
  <text x="7"  y="11" font-family="Georgia,serif" font-size="10" text-anchor="middle" fill="#111">♠</text>
  <!-- ♥ top-right, red -->
  <text x="25" y="11" font-family="Georgia,serif" font-size="10" text-anchor="middle" fill="#cc1111">♥</text>
  <!-- ♣ bottom-left, black -->
  <text x="7"  y="28" font-family="Georgia,serif" font-size="10" text-anchor="middle" fill="#111">♣</text>
  <!-- ♦ bottom-right, red -->
  <text x="25" y="28" font-family="Georgia,serif" font-size="10" text-anchor="middle" fill="#cc1111">♦</text>
  <!-- Joker hat centered (small, white) -->
  <image href="/joker-silhouette.png" x="10" y="11" width="12" height="10" filter="url(#white-hat)" opacity="0.85"/>
</svg>

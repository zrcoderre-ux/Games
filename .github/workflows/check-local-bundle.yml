name: Check local.js bundle is up to date

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild local.js
        run: npm run build

      - name: Fail if local.js is stale
        run: |
          if ! git diff --exit-code public/local.js; then
            echo ""
            echo "ERROR: public/local.js is out of date."
            echo "Run 'npm run build' locally and commit the result."
            exit 1
          fi
